name: Release

on:
  push:
    tags: ['v*']

jobs:
  docker:
    name: Build & Push worker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            EIWA_CACHE_BUST=${{ github.sha }}
          tags: |
            eiwac/browser-worker:${{ github.ref_name }}
            eiwac/browser-worker:latest

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: eiwac/browser-worker
          short-description: "Eiwa Browser Worker: headless Chromium automation over JSON-RPC 2.0."
          readme-filepath: ./docs/docker-hub-overview.md
