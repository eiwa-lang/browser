# Namespace (shared with the example stack; apply is idempotent)
apiVersion: v1
kind: Namespace
metadata:
  name: eiwa
  labels:
    name: eiwa
    environment: production
---
# Deployment: Browser Worker (Engine + headless Chromium, internal only)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: browser-worker
  namespace: eiwa
spec:
  replicas: 2
  selector:
    matchLabels:
      app: browser-worker
  template:
    metadata:
      labels:
        app: browser-worker
    spec:
      containers:
        - name: browser-worker
          image: eiwac/eiwa-browser-worker:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: "1Gi"
              cpu: "1"
            limits:
              memory: "4Gi"
              cpu: "2"
      restartPolicy: Always
---
# Service: Browser Worker (stable internal DNS for the client pool, §30.3)
# Court Scraper connects poolSize WebSockets to ws://browser-worker:8080
apiVersion: v1
kind: Service
metadata:
  name: browser-worker
  namespace: eiwa
spec:
  selector:
    app: browser-worker
  ports:
  - port: 8080
    targetPort: 8080
# NOTE: intentionally no IngressRoute — internal trusted network only (§38).
